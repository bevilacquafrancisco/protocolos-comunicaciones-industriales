<?xml version="1.0" encoding="UTF-8"?>
<!--
  conexionado.svg - Diagrama de conexiones electricas, Tarea 2 OPC UA (PdCI, UNRaf)
  Autores: Bevilacqua Francisco, Peralta Agustina - 2026-10-27 - v1.0
  Identico en RPi 1 (servidor) y RPi 2 (cliente). Pines BCM de versiones/v2-correccion-python/comun.py
-->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640"
     font-family="Arial, Helvetica, sans-serif" font-size="13">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#ffffff"/>

  <!-- ====================== Titulo ====================== -->
  <text x="480" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f3a5f">Conexionado de cada Raspberry Pi 4 — idéntico en RPi 1 (servidor) y RPi 2 (cliente)</text>
  <text x="480" y="56" text-anchor="middle" fill="#6b7280">Cablear con la placa desenchufada · los GPIO son de 3,3 V: nunca llevarles 5 V (pines 2 y 4)</text>

  <!-- ====================== Cabezal J8 (pines 1-14) ====================== -->
  <text x="170" y="92" text-anchor="middle" font-weight="bold" fill="#1f3a5f">Cabezal GPIO J8 · pines 1 a 14</text>
  <rect x="132" y="102" width="76" height="244" rx="4" fill="#f3f4f6" stroke="#6b7280"/>
  <!-- fila impar (interior) cx=150 / fila par (borde de la placa) cx=190; y = 120 + 34*i -->
  <g font-size="9" text-anchor="middle" font-weight="bold">
    <rect x="140" y="110" width="20" height="20" fill="#b91c1c"/><text x="150" y="124" fill="#fff">1</text>
    <circle cx="190" cy="120" r="10" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="190" y="124" fill="#c2410c">2</text>
    <circle cx="150" cy="154" r="10" fill="#d1d5db"/><text x="150" y="158">3</text>
    <circle cx="190" cy="154" r="10" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="190" y="158" fill="#c2410c">4</text>
    <circle cx="150" cy="188" r="10" fill="#d1d5db"/><text x="150" y="192">5</text>
    <circle cx="190" cy="188" r="10" fill="#222"/><text x="190" y="192" fill="#fff">6</text>
    <circle cx="150" cy="222" r="10" fill="#d1d5db"/><text x="150" y="226">7</text>
    <circle cx="190" cy="222" r="10" fill="#d1d5db"/><text x="190" y="226">8</text>
    <circle cx="150" cy="256" r="10" fill="#222"/><text x="150" y="260" fill="#fff">9</text>
    <circle cx="190" cy="256" r="10" fill="#d1d5db"/><text x="190" y="260">10</text>
    <circle cx="150" cy="290" r="10" fill="#1f3a5f"/><text x="150" y="294" fill="#fff">11</text>
    <circle cx="190" cy="290" r="10" fill="#1f3a5f"/><text x="190" y="294" fill="#fff">12</text>
    <circle cx="150" cy="324" r="10" fill="#1f3a5f"/><text x="150" y="328" fill="#fff">13</text>
    <circle cx="190" cy="324" r="10" fill="#222"/><text x="190" y="328" fill="#fff">14</text>
  </g>
  <g font-size="12">
    <text x="128" y="124" text-anchor="end" fill="#b91c1c" font-weight="bold">3V3</text>
    <text x="128" y="158" text-anchor="end" fill="#6b7280">GPIO2</text>
    <text x="128" y="192" text-anchor="end" fill="#6b7280">GPIO3</text>
    <text x="128" y="226" text-anchor="end" fill="#6b7280">GPIO4</text>
    <text x="128" y="260" text-anchor="end" fill="#222" font-weight="bold">GND</text>
    <text x="128" y="294" text-anchor="end" fill="#1f3a5f" font-weight="bold">GPIO17</text>
    <text x="128" y="328" text-anchor="end" fill="#1f3a5f" font-weight="bold">GPIO27</text>
    <text x="212" y="124" fill="#c2410c" font-weight="bold">5V ✗</text>
    <text x="212" y="158" fill="#c2410c" font-weight="bold">5V ✗</text>
    <text x="212" y="192" fill="#222" font-weight="bold">GND</text>
    <text x="212" y="226" fill="#6b7280">GPIO14</text>
    <text x="212" y="260" fill="#6b7280">GPIO15</text>
    <text x="212" y="294" fill="#1f3a5f" font-weight="bold">GPIO18</text>
    <text x="212" y="328" fill="#222" font-weight="bold">GND</text>
  </g>
  <g font-size="11" fill="#6b7280">
    <text x="30" y="372">Pin 1 (cuadrado): extremo del cabezal más alejado</text>
    <text x="30" y="387">de los USB, fila interior. Los pares dan al borde.</text>
    <text x="30" y="402">Numeración física (pin) ≠ numeración BCM (GPIO).</text>
  </g>

  <!-- ====================== Circuito 1: pulsador ====================== -->
  <text x="330" y="80" font-weight="bold" fill="#1f3a5f">① Pulsador → Servidor/Cliente.EstadoPulsador</text>
  <rect x="330" y="110" width="140" height="34" rx="4" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="400" y="132" text-anchor="middle" font-weight="bold" fill="#b91c1c">Pin 1 · 3V3</text>
  <line x1="470" y1="127" x2="565" y2="127" stroke="#b91c1c" stroke-width="2.5"/>
  <circle cx="570" cy="127" r="5" fill="#fff" stroke="#222" stroke-width="2"/>
  <circle cx="640" cy="127" r="5" fill="#fff" stroke="#222" stroke-width="2"/>
  <line x1="560" y1="108" x2="650" y2="108" stroke="#222" stroke-width="2.5"/>
  <line x1="605" y1="108" x2="605" y2="92" stroke="#222" stroke-width="2"/>
  <line x1="594" y1="92" x2="616" y2="92" stroke="#222" stroke-width="2.5"/>
  <text x="605" y="150" text-anchor="middle" font-size="11" fill="#6b7280">pulsador NA</text>
  <line x1="645" y1="127" x2="800" y2="127" stroke="#1f3a5f" stroke-width="2.5"/>
  <rect x="800" y="110" width="140" height="34" rx="4" fill="#eff6ff" stroke="#1f3a5f" stroke-width="2"/>
  <text x="870" y="132" text-anchor="middle" font-weight="bold" fill="#1f3a5f">Pin 11 · GPIO17</text>
  <text x="330" y="170" font-size="12" fill="#222">Python (v1/v2): pull-down interno · Button(17, pull_up=False) · presionado = 1</text>
  <text x="330" y="188" font-size="12" fill="#c2410c">Node-RED (v3): ese borne va al Pin 9 · GND · pull-up interno · presionado = 0</text>
  <text x="330" y="206" font-size="12" fill="#6b7280">Pulsador de 4 patas: conectar dos patas en diagonal. Sin resistencia externa.</text>

  <!-- ====================== Circuito 2: LED digital ====================== -->
  <text x="330" y="246" font-weight="bold" fill="#1f3a5f">② LED digital ← EstadoPulsador del otro equipo</text>
  <rect x="330" y="260" width="140" height="34" rx="4" fill="#eff6ff" stroke="#1f3a5f" stroke-width="2"/>
  <text x="400" y="282" text-anchor="middle" font-weight="bold" fill="#1f3a5f">Pin 13 · GPIO27</text>
  <line x1="470" y1="277" x2="530" y2="277" stroke="#1f3a5f" stroke-width="2.5"/>
  <rect x="530" y="268" width="66" height="18" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="563" y="261" text-anchor="middle" font-size="12" font-weight="bold">220 Ω</text>
  <line x1="596" y1="277" x2="652" y2="277" stroke="#1f3a5f" stroke-width="2.5"/>
  <polygon points="652,262 652,292 680,277" fill="#fde68a" stroke="#222" stroke-width="2"/>
  <line x1="681" y1="262" x2="681" y2="292" stroke="#222" stroke-width="2.5"/>
  <line x1="668" y1="258" x2="680" y2="244" stroke="#c2410c" stroke-width="1.5" marker-end="url(#flecha)"/>
  <line x1="678" y1="262" x2="690" y2="248" stroke="#c2410c" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="640" y="310" text-anchor="end" font-size="11" fill="#6b7280">ánodo + (pata larga)</text>
  <text x="690" y="310" font-size="11" fill="#6b7280">cátodo − (lado plano)</text>
  <line x1="682" y1="277" x2="800" y2="277" stroke="#222" stroke-width="2.5"/>
  <rect x="800" y="260" width="140" height="34" rx="4" fill="#f3f4f6" stroke="#222" stroke-width="2"/>
  <text x="870" y="282" text-anchor="middle" font-weight="bold" fill="#222">Pin 14 · GND</text>
  <text x="330" y="332" font-size="12" fill="#222">I ≈ (3,3 V − 2,0 V) / 220 Ω ≈ 6 mA &lt; 16 mA por pin · 330 Ω también sirve (≈ 4 mA)</text>

  <!-- ====================== Circuito 3: LED PWM ====================== -->
  <text x="330" y="376" font-weight="bold" fill="#1f3a5f">③ LED PWM ← Rampa del otro equipo, escalada a 0–255</text>
  <rect x="330" y="390" width="140" height="34" rx="4" fill="#eff6ff" stroke="#1f3a5f" stroke-width="2"/>
  <text x="400" y="412" text-anchor="middle" font-weight="bold" fill="#1f3a5f">Pin 12 · GPIO18</text>
  <line x1="470" y1="407" x2="530" y2="407" stroke="#1f3a5f" stroke-width="2.5"/>
  <rect x="530" y="398" width="66" height="18" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="563" y="391" text-anchor="middle" font-size="12" font-weight="bold">220 Ω</text>
  <line x1="596" y1="407" x2="652" y2="407" stroke="#1f3a5f" stroke-width="2.5"/>
  <polygon points="652,392 652,422 680,407" fill="#fde68a" stroke="#222" stroke-width="2"/>
  <line x1="681" y1="392" x2="681" y2="422" stroke="#222" stroke-width="2.5"/>
  <line x1="668" y1="388" x2="680" y2="374" stroke="#c2410c" stroke-width="1.5" marker-end="url(#flecha)"/>
  <line x1="678" y1="392" x2="690" y2="378" stroke="#c2410c" stroke-width="1.5" marker-end="url(#flecha)"/>
  <line x1="682" y1="407" x2="800" y2="407" stroke="#222" stroke-width="2.5"/>
  <rect x="800" y="390" width="140" height="34" rx="4" fill="#f3f4f6" stroke="#222" stroke-width="2"/>
  <text x="870" y="412" text-anchor="middle" font-weight="bold" fill="#222">Pin 6 · GND</text>
  <text x="330" y="446" font-size="12" fill="#222">GPIO18 = PWM0 por hardware · RPi 1 muestra la triangular (8 s), RPi 2 la sierra (4 s)</text>

  <!-- ====================== Enlace entre placas ====================== -->
  <line x1="30" y1="476" x2="930" y2="476" stroke="#d1d5db"/>
  <text x="480" y="500" text-anchor="middle" font-weight="bold" fill="#1f3a5f">Enlace Ethernet punto a punto (Parte 1) · sin switch ni router</text>
  <rect x="60" y="516" width="250" height="78" rx="6" fill="#eff6ff" stroke="#1f3a5f" stroke-width="2"/>
  <text x="185" y="540" text-anchor="middle" font-weight="bold" fill="#1f3a5f">RPi 1 · servidor OPC UA</text>
  <text x="185" y="560" text-anchor="middle">eth0 192.168.10.1/24 · :4840</text>
  <text x="185" y="580" text-anchor="middle" fill="#6b7280">wlan0 DHCP (SSH, UaExpert)</text>
  <rect x="650" y="516" width="250" height="78" rx="6" fill="#eff6ff" stroke="#1f3a5f" stroke-width="2"/>
  <text x="775" y="540" text-anchor="middle" font-weight="bold" fill="#1f3a5f">RPi 2 · cliente OPC UA</text>
  <text x="775" y="560" text-anchor="middle">eth0 192.168.10.2/24</text>
  <text x="775" y="580" text-anchor="middle" fill="#6b7280">wlan0 DHCP (SSH)</text>
  <line x1="310" y1="555" x2="650" y2="555" stroke="#1f3a5f" stroke-width="5"/>
  <text x="480" y="545" text-anchor="middle" font-size="12">UTP Cat 5e, directo o cruzado (auto MDI-X)</text>
  <text x="480" y="573" text-anchor="middle" font-size="12">1000BASE-T full-dúplex · todo el tráfico OPC UA</text>
  <text x="480" y="620" text-anchor="middle" font-size="11" fill="#6b7280">Fuente de cada placa: USB-C 5,1 V / 3 A. Masa común solo dentro de cada placa (las dos placas no comparten GND ni cables de GPIO).</text>
</svg>
